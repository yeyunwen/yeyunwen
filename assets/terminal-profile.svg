<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ye Yunwen terminal profile</title>
  <desc id="desc">A green CRT terminal showing Ye Yunwen's developer profile.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#213b1e"/>
      <stop offset="0.48" stop-color="#122717"/>
      <stop offset="1" stop-color="#07130b"/>
    </linearGradient>
    <radialGradient id="phosphor" cx="0.42" cy="0.46" r="0.78">
      <stop offset="0" stop-color="#b9ff7a" stop-opacity="0.18"/>
      <stop offset="0.68" stop-color="#53b83c" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#d7ffb0" opacity="0.14"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .label { fill: #93e36d; font-size: 21px; font-weight: 700; letter-spacing: 1px; }
    .value { fill: #d7ffb0; font-size: 20px; }
    .muted { fill: #76b763; font-size: 16px; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .flicker { animation: flicker 5s ease-in-out infinite; }
    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes flicker { 0%, 100% { opacity: .16; } 50% { opacity: .23; } 52% { opacity: .12; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .flicker { animation: none; } }
  </style>

  <rect width="1200" height="620" rx="26" fill="#c7c9bf"/>
  <rect x="14" y="14" width="1172" height="592" rx="20" fill="#151913" stroke="#61685b" stroke-width="3"/>
  <rect x="29" y="29" width="1142" height="562" rx="10" fill="url(#screen)" stroke="#384e35" stroke-width="3"/>
  <rect x="29" y="29" width="1142" height="562" rx="10" fill="url(#phosphor)"/>
  <rect class="flicker" x="29" y="29" width="1142" height="562" rx="10" fill="url(#scanlines)"/>

  <g class="mono">
    <text x="57" y="76" class="muted">YEYUNWEN@MACBOOK :: PROFILE.EXE</text>
    <text x="57" y="108" class="muted">------------------------------------------</text>

    <!-- Pixel portrait -->
    <g fill="#e7f6d2" filter="url(#glow)">
      <path d="M232 194h24v-18h24v-18h78v18h24v18h18v76h-18v28h-24v20h-78v-20h-24v-28h-18v-76z"/>
      <path d="M183 314h36v-18h32v18h84v-18h32v18h36v24h18v48h-30v34h-18v28h-24v20h-30v20h-84v-20h-30v-20h-24v-28h-18v-34h-30v-48h18v-24z"/>
      <path d="M157 482h66v-20h106v20h66v30h-66v22H223v-22h-66z"/>
    </g>
    <g fill="#153719" opacity=".9">
      <path d="M232 194h24v-18h78v18h24v36h-18v-18h-24v-12h-54v12h-30z"/>
      <rect x="267" y="234" width="18" height="10"/><rect x="321" y="234" width="18" height="10"/>
      <rect x="286" y="267" width="52" height="8"/>
    </g>
    <g fill="#b9ff7a" opacity=".55">
      <rect x="117" y="170" width="18" height="5"/><rect x="139" y="170" width="18" height="5"/>
      <rect x="163" y="170" width="18" height="5"/><rect x="421" y="170" width="18" height="5"/>
      <rect x="444" y="170" width="18" height="5"/><rect x="467" y="170" width="18" height="5"/>
      <rect x="90" y="206" width="42" height="5"/><rect x="450" y="206" width="54" height="5"/>
      <rect x="86" y="250" width="82" height="5"/><rect x="441" y="250" width="72" height="5"/>
      <rect x="84" y="294" width="58" height="5"/><rect x="470" y="294" width="88" height="5"/>
      <rect x="71" y="340" width="74" height="5"/><rect x="462" y="340" width="82" height="5"/>
      <rect x="69" y="386" width="80" height="5"/><rect x="474" y="386" width="78" height="5"/>
      <rect x="83" y="432" width="62" height="5"/><rect x="461" y="432" width="82" height="5"/>
    </g>

    <!-- Profile details -->
    <text x="640" y="157" class="label">Name:</text><text x="810" y="157" class="value">Ye Yunwen</text>
    <text x="640" y="193" class="label">Role:</text><text x="810" y="193" class="value">Frontend / Full-stack</text>
    <text x="640" y="229" class="label">Base:</text><text x="810" y="229" class="value">Hangzhou, China</text>
    <text x="640" y="283" class="label">Core:</text><text x="810" y="283" class="value">TypeScript, Vue, React</text>
    <text x="810" y="313" class="value">Go, Python, Node.js</text>
    <text x="640" y="367" class="label">Builds:</text><text x="810" y="367" class="value">Tools, interfaces, AI apps</text>
    <text x="640" y="421" class="label">Status:</text><text x="810" y="421" class="value">Learning in public</text>
    <circle cx="1065" cy="414" r="8" fill="#9cff65" filter="url(#glow)"/>
    <text x="640" y="494" class="muted">$ ship --with-curiosity</text>
    <text x="640" y="530" class="muted">$ cat /ideas/next.md</text><rect class="cursor" x="1051" y="513" width="12" height="21" fill="#d7ffb0"/>
    <text x="57" y="558" class="muted">[ open source / thoughtful software / steady progress ]</text>
  </g>
</svg>
