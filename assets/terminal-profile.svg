<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ye Yunwen — terminal profile</title>
  <desc id="desc">A polished green phosphor CRT terminal showing Ye Yunwen's developer profile.</desc>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e2e3d9"/><stop offset=".48" stop-color="#b9bdb1"/><stop offset="1" stop-color="#858b80"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d3d1e"/><stop offset=".5" stop-color="#102817"/><stop offset="1" stop-color="#07130c"/></linearGradient>
    <radialGradient id="bloom" cx=".34" cy=".44" r=".75"><stop stop-color="#9cff70" stop-opacity=".18"/><stop offset=".7" stop-color="#4fae42" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".46"/></radialGradient>
    <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#caffad" opacity=".10"/></pattern>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .small { fill: #79bd63; font-size: 16px; letter-spacing: .4px; }
    .key { fill: #9bef6c; font-size: 21px; font-weight: 700; }
    .val { fill: #e4ffd1; font-size: 20px; }
    .blink { animation: blink 1.1s steps(1,end) infinite; }
    .flicker { animation: flicker 6s ease-in-out infinite; }
    @keyframes blink { 0%,44% { opacity: 1 } 45%,100% { opacity: 0 } }
    @keyframes flicker { 0%,100% { opacity: .14 } 48% { opacity: .2 } 50% { opacity: .1 } }
    @media (prefers-reduced-motion: reduce) { .blink, .flicker { animation: none } }
  </style>
  <rect x="22" y="18" width="1156" height="584" rx="30" fill="#697067" opacity=".35"/>
  <rect x="16" y="10" width="1156" height="584" rx="30" fill="url(#bezel)" stroke="#f0f1ea" stroke-width="3"/>
  <rect x="35" y="29" width="1118" height="546" rx="22" fill="#111711" stroke="#535b50" stroke-width="5"/>
  <rect x="49" y="43" width="1090" height="518" rx="15" fill="url(#glass)" stroke="#2e5631" stroke-width="3"/>
  <rect x="49" y="43" width="1090" height="518" rx="15" fill="url(#bloom)"/>
  <rect class="flicker" x="49" y="43" width="1090" height="518" rx="15" fill="url(#scan)"/>
