<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Ye Yunwen</title>
  <desc id="desc">Frontend Engineer and Full-stack Builder</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .orb-a { animation: drift-a 8s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate; transform-box: fill-box; transform-origin: center; }
    .orb-b { animation: drift-b 10s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate; transform-box: fill-box; transform-origin: center; }
    .status { animation: pulse 2.4s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate; }
    .cursor { animation: blink 1.2s linear infinite; }
    @keyframes drift-a { from { transform: translate(-18px, 10px) scale(.96); opacity: .18; } to { transform: translate(24px, -12px) scale(1.04); opacity: .44; } }
    @keyframes drift-b { from { transform: translate(12px, -8px) scale(1.02); opacity: .12; } to { transform: translate(-28px, 14px) scale(.96); opacity: .32; } }
    @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
    @keyframes blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .orb-a, .orb-b, .status, .cursor { animation: none; } }
  </style>
  <rect width="1200" height="240" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="24" fill="url(#glow)"/>
  <circle class="orb-a" cx="1030" cy="42" r="116" fill="#c4b5fd" opacity=".2"/>
  <circle class="orb-b" cx="188" cy="228" r="94" fill="#38bdf8" opacity=".14"/>
  <g fill="#ffffff" opacity="0.13">
    <circle cx="84" cy="54" r="5"/><circle cx="112" cy="54" r="5"/><circle cx="140" cy="54" r="5"/>
  </g>
  <circle class="status" cx="1088" cy="58" r="7" fill="#4ade80"/>
  <text x="600" y="112" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="54" font-weight="700" text-anchor="middle">Ye Yunwen</text>
  <text x="600" y="161" fill="#ddd6fe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" text-anchor="middle">Frontend Engineer · Full-stack Builder</text>
  <rect class="cursor" x="917" y="142" width="3" height="26" rx="1.5" fill="#a7f3d0"/>
</svg>
