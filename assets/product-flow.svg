<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Product delivery flow</title>
  <desc id="desc">An animated path from an idea through interface, API, data, and shipping</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <style>
    .packet-a { animation: packet 6s linear infinite; }
    .packet-b { animation: packet 6s linear -2s infinite; }
    .packet-c { animation: packet 6s linear -4s infinite; }
    .node-glow { animation: glow 2.8s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate; }
    @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(820px); opacity: 0; } }
    @keyframes glow { from { opacity: .28; } to { opacity: .72; } }
    @media (prefers-reduced-motion: reduce) { .packet-a, .packet-b, .packet-c, .node-glow { animation: none; } .packet-a, .packet-b, .packet-c { opacity: .7; } }
  </style>
  <rect width="1200" height="230" rx="20" fill="url(#bg)"/>
  <text x="46" y="48" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">PRODUCT DELIVERY · END TO END</text>
  <path d="M190 126H1010" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M190 126H1010" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <g transform="translate(170 126)"><circle class="node-glow" r="38" fill="#8b5cf6" opacity=".34"/><circle r="28" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text y="6" fill="#ede9fe" font-size="18" font-weight="700">Idea</text></g>
    <g transform="translate(375 126)"><circle class="node-glow" r="38" fill="#0ea5e9" opacity=".3"/><circle r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text y="6" fill="#e0f2fe" font-size="17" font-weight="700">Interface</text></g>
    <g transform="translate(580 126)"><circle class="node-glow" r="38" fill="#06b6d4" opacity=".3"/><circle r="28" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text y="6" fill="#cffafe" font-size="18" font-weight="700">API</text></g>
    <g transform="translate(785 126)"><circle class="node-glow" r="38" fill="#f59e0b" opacity=".28"/><circle r="28" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text y="6" fill="#fef3c7" font-size="18" font-weight="700">Data</text></g>
    <g transform="translate(990 126)"><circle class="node-glow" r="38" fill="#22c55e" opacity=".3"/><circle r="28" fill="#0f172a" stroke="#4ade80" stroke-width="2"/><text y="6" fill="#dcfce7" font-size="18" font-weight="700">Ship</text></g>
  </g>
  <circle class="packet-a" cx="180" cy="126" r="7" fill="#f8fafc"/>
  <circle class="packet-b" cx="180" cy="126" r="7" fill="#f8fafc"/>
  <circle class="packet-c" cx="180" cy="126" r="7" fill="#f8fafc"/>
  <text x="600" y="202" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" text-anchor="middle">shape → build → connect → persist → deliver</text>
</svg>
